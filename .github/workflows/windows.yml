name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Vmic.slnx
      - run: dotnet test Vmic.slnx --no-restore --configuration Release --disable-build-servers -m:1
      - run: >-
          dotnet publish src/Vmic.App/Vmic.App.csproj --no-restore --configuration Release
          --runtime win-x64 --self-contained true --output artifacts/app -p:PublishSingleFile=true
      - run: >-
          dotnet publish tools/Vmic.Diagnostics/Vmic.Diagnostics.csproj --no-restore --configuration Release
          --runtime win-x64 --self-contained true --output artifacts/diagnostics -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: Vmic-win-x64
          path: artifacts/
